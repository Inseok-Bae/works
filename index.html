<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="index.documentTitle">Index</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --bg: #f5f5f7;
        --ink: #111217;
        --muted: #59616f;
        --line: rgba(17, 18, 23, 0.14);
        --line-strong: rgba(17, 18, 23, 0.24);
        --frame-max: 980px;
        --fs-meta: 11px;
        --fs-head: clamp(22px, 3.6vw, 36px);
        --fs-item: clamp(15px, 1.35vw, 20px);
        --fs-item-long: clamp(14px, 1.1vw, 17px);
        --sans:
          'SF Pro Display',
          'SUIT Variable',
          'Pretendard Variable',
          'Noto Sans KR',
          'Apple SD Gothic Neo',
          'Segoe UI',
          sans-serif;
        --language-switcher-bg: rgba(20, 21, 26, 0.92);
        --language-switcher-text: #f7f8fc;
        --language-switcher-border: rgba(255, 255, 255, 0.16);
        --language-switcher-item-bg: rgba(255, 255, 255, 0.04);
        --language-switcher-item-hover: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
      }

      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--sans);
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.3) 40%, rgba(255, 255, 255, 0)),
          linear-gradient(180deg, var(--bg) 0%, #eef0f3 100%);
        letter-spacing: -0.004em;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        max-width: calc(var(--frame-max) + 120px);
        margin: 0 auto;
        padding: clamp(18px, 2.8vw, 32px) clamp(14px, 3vw, 32px) clamp(14px, 2.2vw, 22px);
        display: grid;
        grid-template-columns: minmax(0, var(--frame-max)) 88px;
        column-gap: clamp(18px, 2.4vw, 30px);
        align-items: start;
      }

      .mast {
        border-bottom: 1px solid var(--line-strong);
        padding-bottom: clamp(8px, 1.5vw, 12px);
        opacity: 0;
        transform: translateY(6px);
      }

      body.is-ready .mast {
        animation: reveal-up 280ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .mast-top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 6px;
      }

      .mast-label {
        font-size: var(--fs-meta);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-weight: 620;
      }

      .mast-count {
        font-size: var(--fs-meta);
        color: var(--muted);
        letter-spacing: 0.14em;
        font-weight: 620;
      }

      .mast,
      .project-note,
      .gallery-section,
      .credit {
        grid-column: 1;
      }

      .section-nav {
        grid-column: 2;
        grid-row: 1 / span 4;
        align-self: start;
        justify-self: end;
        position: sticky;
        top: 74px;
        display: grid;
        gap: 8px;
        padding-top: 10px;
        opacity: 0;
        transform: translateY(6px);
      }

      .section-nav[hidden] {
        display: none !important;
      }

      body.is-ready .section-nav {
        animation: reveal-up 280ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 42ms;
      }

      .section-nav-link {
        min-height: 30px;
        padding: 0 0 0 14px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        color: var(--muted);
        font-size: var(--fs-meta);
        line-height: 1;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 620;
        text-decoration: none;
        transition: color 140ms ease;
      }

      .section-nav-link::after {
        content: '';
        width: 3px;
        height: 22px;
        border-radius: 999px;
        background: rgba(17, 18, 23, 0.18);
        transition: background 140ms ease, height 180ms ease;
      }

      .section-nav-link:hover {
        color: var(--ink);
      }

      .section-nav-link:hover::after {
        background: rgba(17, 18, 23, 0.36);
      }

      .section-nav-link[data-active='true'] {
        color: var(--ink);
      }

      .section-nav-link[data-active='true']::after {
        height: 32px;
        background: var(--ink);
      }

      .section-nav-link:focus-visible {
        outline: 2px solid #1f2430;
        outline-offset: 4px;
        border-radius: 999px;
      }

      #prefaceSection,
      #worksSection {
        scroll-margin-top: 22px;
      }

      .gallery-section {
        margin-top: clamp(16px, 1.9vw, 22px);
      }

      .gallery {
        margin-top: 0;
      }

      .tile {
        --order: 0;
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 20px;
        align-items: center;
        gap: 8px;
        min-height: 58px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
        color: inherit;
        opacity: 0;
        transform: translateY(6px);
      }

      body.is-ready .tile {
        animation: reveal-up 280ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: calc(var(--order) * 38ms + 64ms);
      }

      .tile:focus-visible {
        outline: 2px solid #1f2430;
        outline-offset: 2px;
      }

      .tile-index {
        font-size: var(--fs-meta);
        line-height: 1;
        color: var(--muted);
        letter-spacing: 0.12em;
        font-weight: 620;
      }

      .tile-label {
        font-size: var(--fs-item);
        line-height: 1.06;
        letter-spacing: -0.016em;
        font-weight: 560;
        text-wrap: balance;
      }

      .tile-label.long {
        font-size: var(--fs-item-long);
        font-weight: 540;
        letter-spacing: -0.012em;
        line-height: 1.12;
      }

      .tile-arrow {
        font-size: 15px;
        color: var(--muted);
        justify-self: end;
        transition: transform 140ms ease, color 140ms ease;
      }

      .tile:hover .tile-arrow {
        transform: translateX(2px);
        color: var(--ink);
      }

      .project-note {
        margin-top: 12px;
        max-width: 760px;
        opacity: 0;
        transform: translateY(6px);
      }

      .project-note[hidden] {
        display: none !important;
      }

      body.is-ready .project-note {
        animation: reveal-up 280ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 18ms;
      }

      .project-note-label {
        margin-bottom: 6px;
        font-size: var(--fs-meta);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-weight: 620;
      }

      .project-note-title {
        margin: 0 0 8px;
        font-size: clamp(13px, 1.2vw, 15px);
        line-height: 1.32;
        letter-spacing: -0.012em;
        font-weight: 560;
      }

      .project-note-body {
        color: rgba(17, 18, 23, 0.82);
      }

      .project-note-body p {
        margin: 0 0 9px;
        font-size: clamp(12px, 1.02vw, 13.5px);
        line-height: 1.66;
        letter-spacing: -0.006em;
      }

      .credit {
        margin-top: 10px;
        font-size: var(--fs-meta);
        color: var(--muted);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(6px);
      }

      body.is-ready .credit {
        animation: reveal-up 280ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: 150ms;
      }

      .language-switcher {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        z-index: 1300;
      }

      .language-switcher-toggle {
        appearance: none;
        min-width: 52px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--language-switcher-border);
        background: var(--language-switcher-bg);
        color: var(--language-switcher-text);
        padding: 0 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 680;
        letter-spacing: 0.08em;
        cursor: pointer;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      }

      .language-switcher-toggle:active {
        transform: translateY(1px);
      }

      .language-switcher-icon {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1.5px solid currentColor;
        display: inline-block;
        position: relative;
        opacity: 0.9;
      }

      .language-switcher-icon::before,
      .language-switcher-icon::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid currentColor;
        border-radius: 999px;
        opacity: 0.75;
      }

      .language-switcher-icon::before {
        width: 4px;
        height: 10px;
      }

      .language-switcher-icon::after {
        width: 10px;
        height: 4px;
      }

      .language-switcher-code {
        min-width: 2ch;
        text-align: center;
      }

      .language-switcher-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: 178px;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid var(--language-switcher-border);
        background: var(--language-switcher-bg);
        color: var(--language-switcher-text);
        display: grid;
        gap: 6px;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(10px);
      }

      .language-switcher-menu[hidden] {
        display: none !important;
      }

      .language-switcher-option {
        appearance: none;
        width: 100%;
        min-height: 32px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--language-switcher-item-bg);
        color: inherit;
        text-align: left;
        font-size: 12px;
        line-height: 1.2;
        font-weight: 620;
        padding: 8px 10px;
        cursor: pointer;
        transition: border-color 140ms ease, background 140ms ease;
      }

      .language-switcher-option:hover {
        border-color: var(--language-switcher-border);
        background: var(--language-switcher-item-hover);
      }

      .language-switcher-option[data-active='true'] {
        border-color: var(--language-switcher-border);
        background: var(--language-switcher-item-hover);
      }

      .language-switcher-toggle:focus-visible,
      .language-switcher-option:focus-visible {
        outline: 2px solid var(--language-switcher-text);
        outline-offset: 2px;
      }

      @keyframes reveal-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 800px) {
        .frame {
          max-width: var(--frame-max);
          display: block;
          padding: 14px 12px calc(72px + env(safe-area-inset-bottom)) 12px;
        }

        .gallery-section {
          margin-top: 14px;
        }

        .tile {
          grid-template-columns: 40px minmax(0, 1fr) 18px;
          min-height: 50px;
          padding: 6px 0;
        }

        .tile-label {
          font-size: clamp(14px, 4.2vw, 18px);
        }

        .tile-label.long {
          font-size: clamp(13px, 3.5vw, 16px);
        }

        .project-note-title {
          font-size: 13px;
        }

        .project-note-body p {
          font-size: 12.5px;
          line-height: 1.62;
        }

        #prefaceSection,
        #worksSection {
          scroll-margin-top: 16px;
        }

        .section-nav {
          position: fixed;
          left: 50%;
          right: auto;
          bottom: max(10px, env(safe-area-inset-bottom));
          top: auto;
          grid-column: auto;
          grid-row: auto;
          display: flex;
          gap: 6px;
          padding: 6px;
          border: 1px solid rgba(17, 18, 23, 0.1);
          border-radius: 999px;
          background: rgba(245, 245, 247, 0.9);
          box-shadow: 0 10px 28px rgba(17, 18, 23, 0.12);
          backdrop-filter: blur(14px);
          transform: translateX(-50%);
          opacity: 1;
          z-index: 1200;
        }

        body.is-ready .section-nav {
          animation: none;
          transform: translateX(-50%);
          opacity: 1;
        }

        .section-nav-link {
          min-height: 34px;
          padding: 0 12px;
          justify-content: center;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.56);
        }

        .section-nav-link::after {
          display: none;
        }

        .section-nav-link[data-active='true'] {
          background: var(--ink);
          color: #f5f5f7;
        }

        .section-nav-link:focus-visible {
          outline-offset: 2px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .mast,
        .section-nav,
        .tile,
        .project-note,
        .credit {
          opacity: 1 !important;
          transform: none !important;
          animation: none !important;
        }

        .section-nav-link,
        .tile,
        .tile-arrow,
        .language-switcher-option {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header class="mast">
        <div class="mast-top">
          <div class="mast-label" data-i18n="index.kicker">inseok</div>
          <div class="mast-count" id="workCount" aria-live="polite">00</div>
        </div>
      </header>

      <nav class="section-nav" id="sectionNav" data-i18n-aria-label="index.sectionNavAria">
        <a class="section-nav-link" href="#prefaceSection" data-section-link="prefaceSection" data-active="true" data-i18n="index.sections.preface">Preface</a>
        <a class="section-nav-link" href="#worksSection" data-section-link="worksSection" data-active="false" data-i18n="index.sections.works">Works</a>
      </nav>

      <section
        class="project-note"
        id="prefaceSection"
        hidden
        data-i18n-aria-label="index.projectReadmeAria"
      >
        <div class="project-note-label" data-i18n="index.projectReadmeLabel">preface</div>
        <div class="project-note-body" id="projectReadmeBody"></div>
      </section>

      <section class="gallery-section" id="worksSection" data-i18n-aria-label="index.galleryAria">
        <div class="gallery" id="gallery"></div>
      </section>

      <footer class="credit">
        <span data-i18n="index.footerCredit">inseok</span>
      </footer>
    </div>

    <script type="module">
      import { resolveLocalizedReadme } from './shared/utils/util.js';

      const PROJECTS = [
        { folder: 'artworks/murmuring', key: 'index.projects.murmuring' },
        { folder: 'artworks/division', key: 'index.projects.division' },
        { folder: 'artworks/violet-cloud-and-sharp-boundaries', key: 'index.projects.violet' },
        { folder: 'artworks/bleeding-colors', key: 'index.projects.bleedingColors' },
      ];

      const SUPPORTED_LANGUAGES = ['ko', 'en', 'zh', 'ja'];
      const FALLBACK_LANGUAGE = 'en';
      const STORAGE_KEY = 'works:preferred-language';

      const gallery = document.getElementById('gallery');
      const workCount = document.getElementById('workCount');
      const projectNote = document.getElementById('prefaceSection');
      const projectReadmeBody = document.getElementById('projectReadmeBody');
      const sectionNav = document.getElementById('sectionNav');
      const sectionNavLinks = Array.from(document.querySelectorAll('[data-section-link]'));
      let sectionObserver = null;

      function asSupportedLanguage(value) {
        if (!value || typeof value !== 'string') return null;
        const lower = value.toLowerCase();
        if (lower.startsWith('zh')) return 'zh';
        if (lower.startsWith('ja')) return 'ja';
        if (lower.startsWith('ko')) return 'ko';
        if (lower.startsWith('en')) return 'en';
        return null;
      }

      function getStoredLanguage() {
        try {
          return asSupportedLanguage(localStorage.getItem(STORAGE_KEY));
        } catch (_) {
          return null;
        }
      }

      function clearStoredLanguage() {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {
          // ignore
        }
      }

      function setStoredLanguage(language) {
        if (!language) {
          clearStoredLanguage();
          return;
        }
        try {
          localStorage.setItem(STORAGE_KEY, language);
        } catch (_) {
          // ignore
        }
      }

      function detectBrowserLanguage() {
        const candidates = navigator.languages || [navigator.language];
        for (const locale of candidates) {
          const normalized = asSupportedLanguage(locale);
          if (normalized) return normalized;
        }
        return FALLBACK_LANGUAGE;
      }

      function getByPath(source, path) {
        if (!source) return undefined;
        return path.split('.').reduce((acc, key) => {
          if (acc && Object.prototype.hasOwnProperty.call(acc, key)) return acc[key];
          return undefined;
        }, source);
      }

      function applyStaticI18n(t) {
        document.querySelectorAll('[data-i18n]').forEach((element) => {
          const key = element.getAttribute('data-i18n');
          if (!key) return;
          element.textContent = t(key);
        });
        document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => {
          const key = element.getAttribute('data-i18n-aria-label');
          if (!key) return;
          element.setAttribute('aria-label', t(key));
        });
        document.querySelectorAll('[data-i18n-title]').forEach((element) => {
          const key = element.getAttribute('data-i18n-title');
          if (!key) return;
          element.setAttribute('title', t(key));
        });
      }

      function renderProjectTiles(t) {
        gallery.innerHTML = '';
        PROJECTS.forEach(({ folder, key }, index) => {
          const title = t(key);
          const href = `./${folder}/index.html`;
          const order = String(index + 1).padStart(2, '0');
          const labelClass = [...String(title)].length > 14 ? 'tile-label long' : 'tile-label';

          gallery.insertAdjacentHTML(
            'beforeend',
            `
          <a class="tile" href="${href}" style="--order:${index};">
            <span class="tile-index">${order}</span>
            <span class="${labelClass}">${title}</span>
            <span class="tile-arrow" aria-hidden="true">&rarr;</span>
          </a>
        `
          );
        });

        workCount.textContent = String(PROJECTS.length).padStart(2, '0');
      }

      function renderProjectReadmeContent(source) {
        if (!projectNote || !projectReadmeBody) return;

        projectReadmeBody.innerHTML = '';
        const blocks = source
          .split(/\r?\n\s*\r?\n/)
          .map((block) => block.trim())
          .filter(Boolean);

        if (!blocks.length) {
          projectNote.hidden = true;
          return;
        }

        const [title, ...paragraphs] = blocks;
        const heading = document.createElement('h2');
        heading.className = 'project-note-title';
        heading.textContent = title;
        projectReadmeBody.appendChild(heading);

        for (const paragraph of paragraphs) {
          const element = document.createElement('p');
          element.textContent = paragraph.replace(/\s*\n\s*/g, ' ');
          projectReadmeBody.appendChild(element);
        }

        projectNote.hidden = false;
      }

      async function loadProjectReadme(language) {
        if (!projectNote || !projectReadmeBody) return;

        projectNote.hidden = true;
        projectReadmeBody.innerHTML = '';

        try {
          const response = await fetch('./README.md');
          if (!response.ok) return;
          const source = await response.text();
          const resolved = resolveLocalizedReadme(source, language).trim();
          if (!resolved) return;
          renderProjectReadmeContent(resolved);
        } catch (_) {
          projectNote.hidden = true;
        }
      }

      function setActiveSection(sectionId) {
        sectionNavLinks.forEach((link) => {
          const isActive = link.dataset.sectionLink === sectionId;
          link.dataset.active = String(isActive);
          if (isActive) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      }

      function initializeSectionNav() {
        if (!sectionNav) return;

        if (sectionObserver) {
          sectionObserver.disconnect();
          sectionObserver = null;
        }

        const pairs = sectionNavLinks
          .map((link) => {
            const target = document.getElementById(link.dataset.sectionLink);
            const visible = Boolean(target) && !target.hidden;
            link.hidden = !visible;
            return visible ? { link, target } : null;
          })
          .filter(Boolean);

        if (!pairs.length) {
          sectionNav.hidden = true;
          return;
        }

        sectionNav.hidden = false;

        pairs.forEach(({ link, target }) => {
          link.onclick = (event) => {
            event.preventDefault();
            setActiveSection(target.id);
            target.scrollIntoView({
              behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
              block: 'start',
            });
            history.replaceState(null, '', '#' + target.id);
          };
        });

        const initialTarget =
          pairs.find(({ target }) => target.id === window.location.hash.slice(1))?.target || pairs[0].target;
        setActiveSection(initialTarget.id);

        sectionObserver = new IntersectionObserver(
          (entries) => {
            const activeEntry = entries
              .filter((entry) => entry.isIntersecting)
              .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];

            if (activeEntry) {
              setActiveSection(activeEntry.target.id);
            }
          },
          {
            rootMargin: '-22% 0px -48% 0px',
            threshold: [0.16, 0.32, 0.52, 0.72],
          }
        );

        pairs.forEach(({ target }) => sectionObserver.observe(target));
      }

      function createLanguageSwitcher(currentLanguage, selectedLanguage, t) {
        document.getElementById('languageSwitcher')?.remove();

        const root = document.createElement('div');
        root.id = 'languageSwitcher';
        root.className = 'language-switcher';

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'language-switcher-toggle';
        toggle.setAttribute('aria-label', t('common.language.toggleAria'));
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute(
          'title',
          t('common.language.toggleTitle', {
            language: t(`common.language.options.${selectedLanguage || 'auto'}`),
          })
        );
        toggle.innerHTML = `
          <span class="language-switcher-icon" aria-hidden="true"></span>
          <span class="language-switcher-code">${currentLanguage.toUpperCase()}</span>
        `;

        const menu = document.createElement('div');
        menu.className = 'language-switcher-menu';
        menu.hidden = true;
        menu.setAttribute('aria-label', t('common.language.menuAria'));

        const options = ['auto', ...SUPPORTED_LANGUAGES];
        for (const language of options) {
          const isAuto = language === 'auto';
          const isActive = isAuto ? selectedLanguage == null : language === selectedLanguage;
          const item = document.createElement('button');
          item.type = 'button';
          item.className = 'language-switcher-option';
          item.dataset.language = language;
          item.dataset.active = String(isActive);
          item.setAttribute('aria-pressed', String(isActive));
          item.textContent = t(`common.language.options.${language}`);
          item.addEventListener('click', () => {
            menu.hidden = true;
            toggle.setAttribute('aria-expanded', 'false');
            if (language === 'auto' && selectedLanguage == null) return;
            if (language === selectedLanguage) return;
            if (language === 'auto') clearStoredLanguage();
            else setStoredLanguage(language);
            window.location.reload();
          });
          menu.appendChild(item);
        }

        const closeMenu = () => {
          menu.hidden = true;
          toggle.setAttribute('aria-expanded', 'false');
        };

        toggle.addEventListener('click', (event) => {
          event.stopPropagation();
          const willOpen = menu.hidden;
          menu.hidden = !willOpen;
          toggle.setAttribute('aria-expanded', String(willOpen));
        });

        document.addEventListener('pointerdown', (event) => {
          if (menu.hidden) return;
          if (root.contains(event.target)) return;
          closeMenu();
        });

        window.addEventListener('keydown', (event) => {
          if (event.key !== 'Escape') return;
          closeMenu();
        });

        root.appendChild(toggle);
        root.appendChild(menu);
        document.body.appendChild(root);
      }

      async function boot() {
        const selectedLanguage = getStoredLanguage();
        const language = selectedLanguage || detectBrowserLanguage();
        document.documentElement.setAttribute('lang', language);

        let catalog = null;
        try {
          const response = await fetch('./i18n/translations.json');
          if (response.ok) {
            catalog = await response.json();
          }
        } catch (_) {
          // fallback below
        }

        const fallbackCatalog = catalog?.[FALLBACK_LANGUAGE] || {};
        const activeCatalog = catalog?.[language] || fallbackCatalog;
        const t = (key, params = {}) => {
          const raw = getByPath(activeCatalog, key) ?? getByPath(fallbackCatalog, key) ?? key;
          if (typeof raw !== 'string') return String(raw);
          return raw.replace(/\{(\w+)\}/g, (_, name) => {
            if (Object.prototype.hasOwnProperty.call(params, name)) return String(params[name]);
            return `{${name}}`;
          });
        };

        applyStaticI18n(t);
        renderProjectTiles(t);
        await loadProjectReadme(language);
        initializeSectionNav();
        createLanguageSwitcher(language, selectedLanguage, t);

        window.requestAnimationFrame(() => {
          document.body.classList.add('is-ready');
        });
      }

      boot();
    </script>
  </body>
</html>
