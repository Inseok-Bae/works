<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="bleeding.documentTitle">번짐</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" defer src="./index.js"></script>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" data-i18n-aria-label="bleeding.canvasAria"></canvas>

      <section id="hud" data-i18n-aria-label="bleeding.hudAria">
        <header class="hud-row">
          <h1 data-i18n="bleeding.title">번짐</h1>
        </header>

        <canvas id="oortHud" class="oort-hud" aria-hidden="true"></canvas>

        <div id="conceptLog" class="concept-log" aria-live="polite"></div>
      </section>

      <button
        id="thoughtMenuToggle"
        class="thought-menu-toggle"
        type="button"
        hidden
        aria-controls="thoughtMenu"
        aria-expanded="false"
        data-i18n-aria-label="common.thought.menuAria"
      >
        <span class="thought-menu-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>

      <nav
        id="thoughtMenu"
        class="thought-menu"
        hidden
        data-i18n-aria-label="common.thought.menuAria"
      >
        <button
          id="thoughtActionOpen"
          class="thought-menu-item"
          type="button"
          data-i18n="common.thought.reopen"
        >
          글 다시 보기
        </button>
        <a
          id="thoughtActionIndex"
          class="thought-menu-item"
          href="../index.html"
          data-i18n="common.thought.backToIndex"
        >
          목차로 돌아가기
        </a>
      </nav>

      <section id="thoughtOverlay" class="thought-overlay">
        <div
          class="thought-card"
          role="dialog"
          aria-modal="true"
          data-i18n-aria-label="common.thought.dialogAria"
        >
          <header class="thought-head">
            <div class="thought-title" data-i18n="common.thought.title">생각</div>
            <button
              id="thoughtClose"
              class="thought-close"
              type="button"
              data-i18n="common.thought.close"
            >
              닫기
            </button>
          </header>
          <article id="readme_section" class="thought-content"></article>
        </div>
      </section>
    </main>
  </body>
</html>
