<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="violet.documentTitle">Violet Cloud and Sharp Boundaries</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" defer src="./index.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="stage" data-i18n-aria-label="violet.canvasAria"></canvas>

      <aside id="panel" data-i18n-aria-label="violet.panelAria">
        <header class="panel-header">
          <div class="panel-title" data-i18n="violet.panelTitle">Violet Cloud / Sharp Boundaries</div>
        </header>

        <section class="panel-section">
          <div class="section-title" data-i18n="violet.sections.metrics">Metrics</div>
          <div id="metrics" class="metrics"></div>
        </section>

        <section class="panel-section">
          <div class="section-title" data-i18n="violet.sections.controls">Controls</div>
          <div class="controls">
            <button id="zoomToggle" type="button" data-i18n="violet.buttons.zoom">Toggle Zoom</button>
            <button id="commitPainting" type="button" data-i18n="violet.buttons.commit">
              Commit Painting
            </button>
            <button id="resetSoft" type="button" data-i18n="violet.buttons.reset">
              Soft Reset
            </button>
            <button id="listenHold" type="button" data-i18n="violet.buttons.listen">
              Listen (Hold)
            </button>
          </div>
          <div class="hint">
            <div class="hint-line" data-i18n="violet.hints.line1">Listen: Hold to sustain</div>
            <div class="hint-line" data-i18n="violet.hints.line2">
              Stroke: one finger sharpens, two fingers smudge
            </div>
            <div class="hint-line" data-i18n="violet.hints.line3">
              Pinch or wheel: pull ear for temporary orientation correction
            </div>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-title" data-i18n="violet.sections.interpretation">Interpretation</div>
          <div id="conceptualLog" class="conceptual-log" aria-live="polite"></div>
        </section>

        <footer class="panel-footer">
          <span
            ><span data-i18n="violet.footer.logEntries">Log Entries</span>:
            <strong id="logCount">0</strong></span
          >
          <span class="muted" data-i18n="violet.footer.transport">console transport + localStorage</span>
        </footer>
      </aside>
    </div>

    <button
      id="thoughtMenuToggle"
      class="thought-menu-toggle"
      type="button"
      hidden
      aria-controls="thoughtMenu"
      aria-expanded="false"
      data-i18n-aria-label="common.thought.menuAria"
    >
      <span class="thought-menu-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <nav
      id="thoughtMenu"
      class="thought-menu"
      hidden
      data-i18n-aria-label="common.thought.menuAria"
    >
      <button
        id="thoughtActionOpen"
        class="thought-menu-item"
        type="button"
        data-i18n="common.thought.reopen"
      >
        Open Thought
      </button>
      <a
        id="thoughtActionIndex"
        class="thought-menu-item"
        href="../../index.html"
        data-i18n="common.thought.backToIndex"
      >
        Back to Index
      </a>
    </nav>

    <section id="thoughtOverlay" class="thought-overlay">
      <div
        class="thought-card"
        role="dialog"
        aria-modal="true"
        data-i18n-aria-label="common.thought.dialogAria"
      >
        <header class="thought-head">
          <div class="thought-title" data-i18n="common.thought.title">Thought</div>
          <button
            id="thoughtClose"
            class="thought-close"
            type="button"
            data-i18n="common.thought.close"
          >
            Close
          </button>
        </header>
        <article id="readme_section" class="thought-content"></article>
      </div>
    </section>
  </body>
</html>
