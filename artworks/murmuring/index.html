<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="murmuring.documentTitle">Murmuring</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" defer src="./index.js"></script>
  </head>
  <body>
    <main id="world">
      <h3 data-i18n="murmuring.heading.conversations">Conversations</h3>
      <div id="conversations_presenter"></div>
      <div>
        <h3 data-i18n="murmuring.heading.graph">Graph</h3>
        <div class="graph_presenter_container">
          <canvas id="conversations_graph_presenter" class="graph_presenter"></canvas>
        </div>
        <div class="graph_presenter_container">
          <canvas id="regret_graph_presenter" class="graph_presenter"></canvas>
        </div>
      </div>
    </main>

    <button
      id="thoughtMenuToggle"
      class="thought-menu-toggle"
      type="button"
      hidden
      aria-controls="thoughtMenu"
      aria-expanded="false"
      data-i18n-aria-label="common.thought.menuAria"
    >
      <span class="thought-menu-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <nav
      id="thoughtMenu"
      class="thought-menu"
      hidden
      data-i18n-aria-label="common.thought.menuAria"
    >
      <button
        id="thoughtActionOpen"
        class="thought-menu-item"
        type="button"
        data-i18n="common.thought.reopen"
      >
        Open Thought
      </button>
      <a
        id="thoughtActionIndex"
        class="thought-menu-item"
        href="../../index.html"
        data-i18n="common.thought.backToIndex"
      >
        Back to Index
      </a>
    </nav>

    <section id="thoughtOverlay" class="thought-overlay">
      <div
        class="thought-card"
        role="dialog"
        aria-modal="true"
        data-i18n-aria-label="common.thought.dialogAria"
      >
        <header class="thought-head">
          <div class="thought-title" data-i18n="common.thought.title">Thought</div>
          <button
            id="thoughtClose"
            class="thought-close"
            type="button"
            data-i18n="common.thought.close"
          >
            Close
          </button>
        </header>
        <article id="readme_section" class="thought-content"></article>
      </div>
    </section>
  </body>
</html>
