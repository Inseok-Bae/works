<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="bleeding.documentTitle">Bleeding Colors</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" defer src="./index.js"></script>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" data-i18n-aria-label="bleeding.canvasAria"></canvas>

      <section id="hud" data-i18n-aria-label="bleeding.hudAria">
        <header class="hud-row">
          <h1 data-i18n="bleeding.title">Bleeding Colors</h1>
        </header>

        <canvas id="oortHud" class="oort-hud" aria-hidden="true"></canvas>

        <div id="conceptLog" class="concept-log" aria-live="polite"></div>
      </section>
    <section id="thoughtOverlay" class="thought-overlay">
        <div
          class="thought-card"
          role="dialog"
          aria-modal="true"
          data-i18n-aria-label="common.thought.dialogAria"
        >
          <header class="thought-head">
            <div class="thought-title" data-i18n="common.thought.title">Thought</div>
            <button
              id="thoughtClose"
              class="thought-close"
              type="button"
              data-i18n="common.thought.close"
            >
              Close
            </button>
          </header>
          <article id="readme_section" class="thought-content"></article>
        </div>
      </section>
    </main>
  </body>
</html>
